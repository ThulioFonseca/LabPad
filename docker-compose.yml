# Sobe o Homelab Monitor de forma autonoma:
#   docker compose up -d --build
#
# Toda a configuracao (calendario, RSS, cidade do clima, fuso, tema, layout)
# e feita pelo painel da engrenagem no dashboard e persiste em
# /data/settings.json no volume nomeado abaixo.
services:
  homelab-monitor:
    build: .
    container_name: homelab-monitor
    restart: unless-stopped
    pid: host                 # psutil le o hardware real do host, nao o do container
    network_mode: host        # expoe a porta 8723 direto no host
    # Sem env_file: a configuracao e feita pelo painel da engrenagem no
    # dashboard e persiste em /data/settings.json (volume abaixo).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /etc/os-release:/etc/os-release:ro
      - /etc/hostname:/host-hostname:ro
      - homelab-monitor-data:/data     # persiste /data/settings.json

volumes:
  homelab-monitor-data:
