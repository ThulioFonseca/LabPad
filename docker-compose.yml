# Start the Homelab Monitor standalone:
#   docker compose up -d --build
#
# All configuration (calendar, RSS, weather city, timezone, theme, layout)
# is done through the gear panel on the dashboard and persists in
# /data/settings.json in the named volume below.
services:
  homelab-monitor:
    build: .
    container_name: homelab-monitor
    restart: unless-stopped
    pid: host                 # psutil reads the real host hardware, not the container's
    network_mode: host        # exposes port 8723 directly on the host
    # No env_file: all configuration is done through the gear panel on the
    # dashboard and persists in /data/settings.json (volume below).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /etc/os-release:/etc/os-release:ro
      - /etc/hostname:/host-hostname:ro
      - homelab-monitor-data:/data     # persists /data/settings.json

volumes:
  homelab-monitor-data:
