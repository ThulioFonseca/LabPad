name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov responses

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --ignore=tests/test_settings_validation.py
        # test_settings_validation.py requires flask installed as module —
        # run in a separate step to isolate app.py import path

      - name: Run settings validation tests
        run: |
          PYTHONPATH=backend pytest tests/test_settings_validation.py -v --tb=short
