<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LabPad">
  <!-- Home-screen / tab icons. The README's primary setup is "Add to Home
       Screen" so the iPad launches LabPad fullscreen as a wall display; without
       an apple-touch-icon iOS 9 falls back to an ugly auto-captured screenshot
       for the home-screen tile. PNGs live in static/ (served by the catch-all
       route) and are regenerated by tools/make_icons.py — raster, because iOS
       touch icons don't accept SVG. -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>LabPad</title>
  <script>
    /* Apply saved theme/layout before paint (no flash). */
    (function () {
      var t = 'minimal', m = 'dark', ch = 'normal', nh = 'normal';
      try {
        var raw = localStorage.getItem('labpad.settings');
        if (raw) {
          var p = JSON.parse(raw);
          if (p) {
            if (p.theme) { t = p.theme; }
            if (p.mode)  { m = p.mode; }
            if (p.cardHeight)     { ch = p.cardHeight; }
            if (p.newsCardHeight) { nh = p.newsCardHeight; }
          }
        }
      } catch (e) { /* localStorage unavailable */ }
      document.documentElement.className =
        'theme-' + t + ' mode-' + m + ' cards-' + ch + ' news-' + nh;
    })();
  </script>
  <!-- Typography: only the two families the CSS actually applies are requested —
       Inter for the calendar/news feed lists (cards.css) and Merriweather for
       reader-mode article content (modals.css). Cards and gauges render in the
       native -apple-system stack, so no extra family is loaded for them. This
       <link> is render-blocking, so every family listed here delays first paint
       over the LAN on the iPad 2 — keep it to what is used. CSS fallbacks cover
       the iPad when Google Fonts cannot load. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/topbar.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/weather.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/motion.css">
</head>
<body>

  <header class="topbar">
    <div class="brand" id="brand-refresh" role="button" tabindex="0"
         aria-label="Refresh all (full refresh)">
      <span class="status-dot" id="status-dot" aria-hidden="true"></span>
      <span class="brand-name">LabPad</span>
      <button class="panel-info-btn" id="host-info-btn" type="button"
              aria-label="System info"></button>
      <!-- Empty in normal operation; dashboard.js fills it ("Offline · since
           HH:MM") only when the metrics feed goes stale, so an outage is
           legible from across the room, not just via the 9px dot. -->
      <span class="status-text" id="status-text" role="status" aria-live="polite"></span>
    </div>
    <div class="topbar-center" id="section-weather">
      <!-- Filled by dashboard.js -->
    </div>
    <div class="status">
      <button class="notif-btn" id="notif-btn" type="button" aria-label="Notifications">
        <!-- Filled by notifications.js (bell + badge) -->
      </button>
      <span class="theme-control" id="theme-control"><!-- Gear icon: settings.js --></span>
    </div>
  </header>

  <aside class="notif-sidebar" id="notif-sidebar" aria-hidden="true">
    <div class="notif-head">
      <h2 class="notif-title">Notifications</h2>
      <div class="notif-head-actions">
        <button class="notif-clear-all" id="notif-clear-all" type="button">Clear all</button>
        <button class="modal-close" id="notif-sidebar-close" type="button" aria-label="Close">&times;</button>
      </div>
    </div>
    <div class="notif-list" id="notif-list"></div>
    <div class="notif-empty" id="notif-empty">No unread notifications.</div>
  </aside>

  <div class="modal-backdrop" id="notification-modal">
    <div class="modal" id="notification-modal-box">
      <div class="modal-head">
        <h2 class="modal-title" id="notification-modal-title">Notification</h2>
        <div class="modal-head-actions">
          <button class="modal-action" id="notification-modal-trash" type="button"
                  aria-label="Mark as read"></button>
          <button class="modal-close" id="notification-modal-close" type="button"
                  aria-label="Close">&times;</button>
        </div>
      </div>
      <div class="modal-body" id="notification-modal-body"></div>
    </div>
  </div>

  <main>
    <section class="panel">
      <div class="card-grid" id="section-host"></div>
      <!-- Wide row: four single-width cards. #section-calendar is the event
           LIST in the feeds row and #section-weather is the topbar carousel —
           the two ids below are the month grid and the large-type weather card,
           readable from across the room. -->
      <div class="double-row" id="section-wide">
        <div class="card" id="section-network"></div>
        <div class="card" id="section-docker-summary"></div>
        <div class="card" id="section-calendar-month"></div>
        <div class="card" id="section-weather-card"></div>
      </div>
    </section>

    <div class="feeds-row">
      <section class="panel panel--feed">
        <h2 class="panel-title">Calendar</h2>
        <div class="feed-list" id="section-calendar"></div>
      </section>
      <section class="panel panel--feed">
        <h2 class="panel-title">News</h2>
        <div class="feed-list" id="section-news"></div>
      </section>
    </div>

  </main>

  <div class="modal-backdrop" id="containers-modal">
    <div class="modal" id="containers-modal-box">
      <div class="modal-head">
        <h2 class="modal-title">
          Containers <span class="panel-count" id="container-count"></span>
        </h2>
        <button class="modal-close" id="containers-modal-close" type="button"
                aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="container-list" id="section-containers"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="system-modal">
    <div class="modal" id="system-modal-box">
      <div class="modal-head">
        <h2 class="modal-title">System</h2>
        <button class="modal-close" id="system-modal-close" type="button"
                aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="system-modal-body"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="weather-modal">
    <div class="modal modal--weather" id="weather-modal-box">
      <div class="modal-head">
        <h2 class="modal-title">Weather<span class="wx-modal-city" id="weather-modal-city"></span></h2>
        <button class="modal-close" id="weather-modal-close" type="button"
                aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="weather-modal-body"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="settings-modal">
    <div class="modal modal--settings" id="settings-modal-box">
      <div class="modal-head">
        <h2 class="modal-title">Settings</h2>
        <button class="modal-close" id="settings-modal-close" type="button"
                aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="settings-modal-body"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="article-modal">
    <div class="modal modal--article" id="article-modal-box">
      <div class="modal-head">
        <h2 class="modal-title" id="article-modal-source">Article</h2>
        <div class="modal-head-actions">
          <a class="modal-action" id="article-modal-extlink"
             href="#" target="_blank" rel="noopener"
             aria-label="Open in browser"></a>
          <button class="modal-close" id="article-modal-close" type="button"
                  aria-label="Close">&times;</button>
        </div>
      </div>
      <div class="modal-body modal-body--article" id="article-modal-body"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="disk-modal">
    <div class="modal" id="disk-modal-box">
      <div class="modal-head">
        <h2 class="modal-title">Disk</h2>
        <button class="modal-close" id="disk-modal-close" type="button"
                aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="disk-modal-body"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="logs-modal">
    <div class="modal modal--logs" id="logs-modal-box">
      <div class="modal-head">
        <h2 class="modal-title">Logs: <span id="logs-modal-name"></span></h2>
        <div class="modal-head-actions">
          <button class="modal-action" id="logs-modal-refresh" type="button"
                  aria-label="Refresh"></button>
          <button class="modal-close" id="logs-modal-close" type="button"
                  aria-label="Close">&times;</button>
        </div>
      </div>
      <div class="modal-body modal-body--logs" id="logs-modal-body">
        <pre class="logs-pre" id="logs-modal-pre"></pre>
      </div>
    </div>
  </div>

  <!-- Loaded FIRST so window.onerror is armed before the other scripts run.
       Captures unhandled JS errors and POSTs them to /api/client-error (they
       surface in docker logs — the only debug window on a kiosk iPad), but
       dedupes, rate-limits and caps the reports so a bug in a repeating path
       can't flood the backend or churn memory over the display's long uptime.
       See the file header and CLAUDE.md. -->
  <script src="js/errors.js"></script>
  <script src="config.js"></script>
  <script src="js/xhr.js"></script>
  <script src="js/format.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/sparkline.js"></script>
  <script src="js/widgets-host.js"></script>
  <script src="js/widgets-containers.js"></script>
  <script src="js/widgets-feeds.js"></script>
  <script src="js/widgets-weather.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
