<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Homelab">
  <title>Homelab Monitor</title>
  <script>
    /* Aplica o tema/layout salvos antes da pintura (sem flash). */
    (function () {
      var t = 'minimal', m = 'dark', ch = 'normal', nh = 'normal';
      try {
        var raw = localStorage.getItem('homelab.settings');
        if (raw) {
          var p = JSON.parse(raw);
          if (p) {
            if (p.theme) { t = p.theme; }
            if (p.mode)  { m = p.mode; }
            if (p.cardHeight)     { ch = p.cardHeight; }
            if (p.newsCardHeight) { nh = p.newsCardHeight; }
          }
        }
        /* compat com a v1 do theme.js (chaves separadas) */
        var oldT = localStorage.getItem('homelab.theme');
        var oldM = localStorage.getItem('homelab.mode');
        if (oldT) { t = oldT; }
        if (oldM) { m = oldM; }
      } catch (e) { /* localStorage indisponivel */ }
      document.documentElement.className =
        'theme-' + t + ' mode-' + m + ' cards-' + ch + ' news-' + nh;
    })();
  </script>
  <!-- Tipografia (Opcao 3 do guia "Hibrido de Alta Performance" — modelo
       NYT/Medium): Montserrat para cards (sans escaneavel) + Merriweather
       para conteudo do modo leitura (serif desenhada para tela).
       Fallbacks no CSS cobrem o caso do iPad estar offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Merriweather:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-name">Homelab</span>
      <button class="panel-info-btn" id="host-info-btn" type="button"
              aria-label="Informacoes do sistema"></button>
    </div>
    <div class="topbar-center" id="section-weather">
      <!-- preenchido por dashboard.js -->
    </div>
    <div class="status">
      <button class="status-btn" id="status-btn" type="button" aria-label="Menu de conexao">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">conectando&hellip;</span>
      </button>
      <div class="status-menu" id="status-menu">
        <button class="status-menu-item" id="status-refresh-btn" type="button">Full refresh</button>
      </div>
      <span class="clock" id="clock">--:--:--</span>
      <span class="theme-control" id="theme-control"><!-- engrenagem: settings.js --></span>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="card-grid" id="section-host"></div>
      <div class="double-row" id="section-wide">
        <div class="card" id="section-network"></div>
        <div class="card" id="section-docker-summary"></div>
      </div>
    </section>

    <div class="feeds-row">
      <section class="panel panel--feed">
        <h2 class="panel-title">Agenda</h2>
        <div class="feed-list" id="section-calendar"></div>
      </section>
      <section class="panel panel--feed">
        <h2 class="panel-title">Noticias</h2>
        <div class="feed-list" id="section-news"></div>
      </section>
    </div>

  </main>

  <div class="modal-backdrop" id="containers-modal">
    <div class="modal" id="containers-modal-box">
      <div class="modal-head">
        <h2 class="modal-title">
          Containers <span class="panel-count" id="container-count"></span>
        </h2>
        <button class="modal-close" id="containers-modal-close" type="button"
                aria-label="Fechar">&times;</button>
      </div>
      <div class="modal-body">
        <div class="container-list" id="section-containers"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="system-modal">
    <div class="modal" id="system-modal-box">
      <div class="modal-head">
        <h2 class="modal-title">Sistema</h2>
        <button class="modal-close" id="system-modal-close" type="button"
                aria-label="Fechar">&times;</button>
      </div>
      <div class="modal-body" id="system-modal-body"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="weather-modal">
    <div class="modal modal--weather" id="weather-modal-box">
      <div class="modal-head">
        <h2 class="modal-title">Clima<span class="wx-modal-city" id="weather-modal-city"></span></h2>
        <button class="modal-close" id="weather-modal-close" type="button"
                aria-label="Fechar">&times;</button>
      </div>
      <div class="modal-body" id="weather-modal-body"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="settings-modal">
    <div class="modal modal--settings" id="settings-modal-box">
      <div class="modal-head">
        <h2 class="modal-title">Configuracoes</h2>
        <button class="modal-close" id="settings-modal-close" type="button"
                aria-label="Fechar">&times;</button>
      </div>
      <div class="modal-body" id="settings-modal-body"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="article-modal">
    <div class="modal modal--article" id="article-modal-box">
      <div class="modal-head">
        <h2 class="modal-title" id="article-modal-source">Noticia</h2>
        <div class="modal-head-actions">
          <a class="modal-action" id="article-modal-extlink"
             href="#" target="_blank" rel="noopener"
             aria-label="Abrir no navegador"></a>
          <button class="modal-close" id="article-modal-close" type="button"
                  aria-label="Fechar">&times;</button>
        </div>
      </div>
      <div class="modal-body modal-body--article" id="article-modal-body"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="disk-modal">
    <div class="modal" id="disk-modal-box">
      <div class="modal-head">
        <h2 class="modal-title">Disco</h2>
        <button class="modal-close" id="disk-modal-close" type="button"
                aria-label="Fechar">&times;</button>
      </div>
      <div class="modal-body" id="disk-modal-body"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="logs-modal">
    <div class="modal modal--logs" id="logs-modal-box">
      <div class="modal-head">
        <h2 class="modal-title">Logs: <span id="logs-modal-name"></span></h2>
        <div class="modal-head-actions">
          <button class="modal-action" id="logs-modal-refresh" type="button"
                  aria-label="Atualizar"></button>
          <button class="modal-close" id="logs-modal-close" type="button"
                  aria-label="Fechar">&times;</button>
        </div>
      </div>
      <div class="modal-body modal-body--logs" id="logs-modal-body">
        <pre class="logs-pre" id="logs-modal-pre"></pre>
      </div>
    </div>
  </div>

  <script>
    /* Captura erros JS nao tratados e envia para o backend (aparece em docker logs). */
    window.onerror = function (message, source, lineno) {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/client-error', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(JSON.stringify({ message: message, source: source, lineno: lineno }));
      } catch (e2) { /* nao pode fazer nada */ }
      return false; /* nao suprime o erro — continua propagando */
    };
  </script>
  <script src="config.js"></script>
  <script src="js/xhr.js"></script>
  <script src="js/format.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/sparkline.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
