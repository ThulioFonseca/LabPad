<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Homelab">
  <title>Homelab Monitor</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-name">Homelab</span>
    </div>
    <div class="topbar-center" id="section-weather">
      <!-- preenchido por dashboard.js -->
    </div>
    <div class="status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">conectando&hellip;</span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2 class="panel-title">Host</h2>
      <div class="panel-meta" id="section-meta"></div>
      <div class="card-grid" id="section-host"></div>
      <div class="double-row" id="section-wide">
        <div class="card" id="section-network"></div>
        <div class="card" id="section-docker-summary"></div>
      </div>
    </section>

    <div class="feeds-row">
      <section class="panel panel--feed">
        <h2 class="panel-title">Agenda</h2>
        <div class="feed-list" id="section-calendar"></div>
      </section>
      <section class="panel panel--feed">
        <h2 class="panel-title">Noticias</h2>
        <div class="feed-list" id="section-news"></div>
      </section>
    </div>

    <section class="panel">
      <h2 class="panel-title">
        Containers <span class="panel-count" id="container-count"></span>
      </h2>
      <div class="container-list" id="section-containers"></div>
    </section>
  </main>

  <footer class="footer">
    <span id="footer-text">Homelab Monitor</span>
    <span id="last-update"></span>
  </footer>

  <script>
    /* Captura erros JS nao tratados e envia para o backend (aparece em docker logs). */
    window.onerror = function (message, source, lineno) {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/client-error', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(JSON.stringify({ message: message, source: source, lineno: lineno }));
      } catch (e2) { /* nao pode fazer nada */ }
      return false; /* nao suprime o erro — continua propagando */
    };
  </script>
  <script src="config.js"></script>
  <script src="js/xhr.js"></script>
  <script src="js/format.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/sparkline.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
